[alembic]
# %(here)s resolves to this ini file's directory, making the script location
# independent of the CWD (run.ps1, manual CLI, programmatic init_db).
script_location = %(here)s/alembic
prepend_sys_path = .
# The backend never uses this URL: env.py drives migrations through
# src.database.get_engine() (DATABASE_URL, asyncpg). Kept as a placeholder for
# offline SQL generation.
sqlalchemy.url = postgresql+asyncpg://supoclip:supoclip_password@localhost:5433/supoclip

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S