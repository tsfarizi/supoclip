[project]
name = "supoclip-asr"
version = "0.1.0"
description = "Standalone ASR transcription service for SupoClip — wraps Qwen3-ASR behind an HTTP contract."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SupoClip" }]
keywords = ["asr", "supoclip", "transcription", "qwen"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "qwen-asr",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
